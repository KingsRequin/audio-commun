[package]
name = "audio-commun"
description = "Capture du son de Windows (WASAPI loopback) et analyses partagées par Prisme, Horizon et Essaim"
version = "0.7.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
default = ["capture", "spectre"]
# Capture loopback d'une sortie ou de certaines applications (Windows seulement).
capture = ["dep:wasapi", "dep:windows", "dep:anyhow"]
# Analyse spectrale (FFT) : bandes mel, charleston, tempo, intensité, tonalité, avec le kick et la
# caisse claire du détecteur appris.
spectre = ["dep:realfft"]

[dependencies]
log = "0.4"
anyhow = { version = "1", optional = true }
wasapi = { version = "0.26", optional = true }
realfft = { version = "3.5", optional = true }

[dependencies.windows]
version = "0.62"
optional = true
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # Processus et leur parent (capture par application)
    "Win32_System_Diagnostics_ToolHelp",
    # Description de l'exécutable (nom affichable des applis sonores)
    "Win32_Storage_FileSystem",
]

[profile.release]
lto = "thin"
codegen-units = 1

# La sonde lit le son réel : elle a besoin de la capture.
[[example]]
name = "kick_probe"
required-features = ["capture"]

# Les bancs jugent aussi l'analyse spectrale.
[[example]]
name = "kick_bench"
required-features = ["spectre"]

[[example]]
name = "tempo_bench"
required-features = ["spectre"]
